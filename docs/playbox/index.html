<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#17152b"><title>PlayBox — jogos juntos</title>
<style>
:root{color-scheme:dark;--bg:#17152b;--card:#24213c;--muted:#b8b4cf;--accent:#c7fa78;--pink:#ffb7d5;--border:#45415f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#393052 0,transparent 55%),var(--bg);color:#fff;font:16px system-ui,sans-serif;min-height:100dvh}main{max-width:650px;margin:auto;padding:22px 16px 44px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:30px;margin:0;letter-spacing:-1.5px}h1 span{color:var(--accent)}h2{font-size:26px;line-height:1.15;margin:8px 0}p{line-height:1.5;color:var(--muted)}.card{border:1px solid var(--border);background:var(--card);border-radius:22px;padding:20px;margin:12px 0}.game{display:block;width:100%;text-align:left;color:white;background:var(--card);border:1px solid var(--border);padding:18px;border-radius:20px;margin:10px 0}.game strong{font-size:20px}.game span{display:block;margin:6px 0 0;color:var(--muted);font-weight:400}.tag{color:var(--accent);font-size:12px;font-weight:bold;letter-spacing:1.2px;text-transform:uppercase}button,input,select{font:inherit;border-radius:12px;min-height:46px}button{cursor:pointer;border:0;font-weight:700;padding:12px 16px;background:var(--accent);color:#181b16}button.secondary{background:#393552;color:white;border:1px solid var(--border)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:3px}input,select{background:#17152b;color:#fff;border:1px solid var(--border);padding:10px;width:100%;margin:5px 0 12px}label{display:block;font-size:14px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.full{width:100%;margin-top:10px}.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px}.score div{padding:10px;background:#302c49;border-radius:12px;overflow-wrap:anywhere}.score b{display:block;font-size:24px;color:var(--accent)}.center{text-align:center}.timer{font-size:52px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:12px}.reference{background:#fff;color:#111;border-radius:18px;min-height:150px;display:grid;place-items:center;padding:18px;margin:12px 0}.reference img{width:150px;height:150px;object-fit:contain}.emoji{font-size:100px;line-height:1.3}.secret{font-size:48px;overflow-wrap:anywhere}.muted{color:var(--muted)}.notice{color:var(--pink);font-weight:650}.small{font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.sr{position:absolute;left:-10000px}footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}a{color:var(--accent)}[hidden]{display:none!important}

main{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(36px,env(safe-area-inset-bottom))}header{margin-bottom:12px}.card{padding:16px;border-radius:20px}.formgroup{margin:18px 0}.name-row{display:flex;gap:8px;align-items:center}.name-row input{flex:1;min-width:0;margin:6px 0}.remove{flex:0 0 46px;padding:0;font-size:24px}.stepper{display:flex;align-items:center;gap:10px;margin:8px 0 16px}.stepper button{flex:0 0 54px;height:52px;font-size:26px;padding:0}.stepper strong{flex:1;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}.timer-control{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.toggle{appearance:none;width:52px;height:30px;min-height:30px;margin:0;padding:0;position:relative;background:#57536b;border-radius:30px;flex:none}.toggle:before{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .15s}.toggle:checked{background:var(--accent)}.toggle:checked:before{transform:translateX(22px);background:#17152b}.reference{min-height:120px;overflow:hidden}.reference img{width:min(100%,260px);height:200px;object-fit:contain}.reference p{color:#38384a}.secret{font-size:clamp(32px,8vw,52px)}.timer{font-size:clamp(38px,12vw,62px)}.play-card .full{min-height:50px}.play-card .row button{min-width:110px;overflow-wrap:anywhere}input,select{font-size:16px}summary{cursor:pointer;padding:6px 0}@media(max-width:380px){main{padding-left:10px;padding-right:10px}.card{padding:13px}.top{align-items:flex-start}.tag{font-size:11px}.small{font-size:12px}}
.series{font-size:17px;color:var(--muted);margin:4px 0 12px;font-weight:500;line-height:1.35}
</style></head><body><main><header><h1>Play<span>Box</span></h1><button class="secondary" id="home">Início</button></header><div id="app"></div><footer>Jogue junto. Fora da tela. • Prévia 0.8 · <a href="privacy.html">Privacidade e referências</a></footer></main><script src="catalog.js?v=8"></script><script src="app.js?v=8"></script><script src="wake.js?v=8"></script></body></html>
